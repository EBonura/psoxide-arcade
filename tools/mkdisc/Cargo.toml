[package]
name    = "mkdisc"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "mkdisc"
path = "src/main.rs"

[dependencies]
disc-toc = { package = "psx-disc-toc", path = "../../.psoxide/engine/crates/psx-disc-toc" }
psx-iso  = { path = "../../.psoxide/crates/psx-iso" }
# The games-library install, shared by every game. A host-only crate, so it is pinned on its own
# revision and does not move the guest SDK components.lock.json pins.
psx-library = { git = "https://github.com/EBonura/PSoXide.git", rev = "d442e2b642f2aab18fb47230ff74cd7b892e6441" }
