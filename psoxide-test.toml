# PSoXide Arcade's test description for psoxide-test (the SDK's harness, tools/psoxide-test). It
# declares what to build and check; the harness decides how. Baseline: psoxide-test.baseline.toml.
schema = 1
name = "PSoXide Arcade"
repository = "EBonura/psoxide-arcade"

# The shipping disc (what the library gets): no journey state compiled in. Each build has its own
# BUILD directory inside `out` (cargo does not relink, so does not rewrite a link map, for a
# feature set it has built before) and writes the disc into `out`.
[[build]]
name = "ship"
out = "build/ship"
commands = [["make", "disc", "BUILD={out}/work", "DIST={out}"]]
collect = { "launcher.exe" = "build/ship/work/guest/mipsel-sony-psx/release/launcher.exe", "launcher.map" = "build/ship/work/guest/mipsel-sony-psx/release/launcher.map", "game-breakout.exe" = "build/ship/work/guest/mipsel-sony-psx/release/game-breakout.exe", "game-invaders.exe" = "build/ship/work/guest/mipsel-sony-psx/release/game-invaders.exe", "game-magikaaaaaarp-pong.exe" = "build/ship/work/guest/mipsel-sony-psx/release/game-magikaaaaaarp-pong.exe" }
disc = "psoxide-arcade.cue"
map = "launcher.map"
layout = false
layout_reason = "no psoxide-pgo layout or profile: every program builds through psoxide-pgo apply --variant off and the disc is pressed by mkisopsx --scenes"

# The journeys' disc: the same four programs with a read-only observation each (cargo feature
# journey-state: ARCADE_LAUNCHER_JOURNEY, BREAKOUT_JOURNEY, INVADERS_JOURNEY, PONG_JOURNEY in the maps).
[[build]]
name = "journey"
out = "build/journey"
commands = [["make", "disc", "FEATURES=journey-state", "BUILD={out}/work", "DIST={out}"]]
collect = { "launcher.exe" = "build/journey/work/guest/mipsel-sony-psx/release/launcher.exe", "launcher.map" = "build/journey/work/guest/mipsel-sony-psx/release/launcher.map" }
disc = "psoxide-arcade.cue"
map = "launcher.map"
layout = false
layout_reason = "no psoxide-pgo layout or profile: every program builds through psoxide-pgo apply --variant off and the disc is pressed by mkisopsx --scenes"

# The breakout program's link, for its size bar: it is linked by the shipping build, so this build only
# copies its map from there (the harness judges one map per build).
[[build]]
name = "breakout"
out = "build/breakout"
commands = [["cp", "build/ship/work/guest/mipsel-sony-psx/release/game-breakout.map", "{out}/game-breakout.map"]]
map = "game-breakout.map"

# The invaders program's link, for its size bar: it is linked by the shipping build, so this build only
# copies its map from there (the harness judges one map per build).
[[build]]
name = "invaders"
out = "build/invaders"
commands = [["cp", "build/ship/work/guest/mipsel-sony-psx/release/game-invaders.map", "{out}/game-invaders.map"]]
map = "game-invaders.map"

# The pong program's link, for its size bar: it is linked by the shipping build, so this build only
# copies its map from there (the harness judges one map per build).
[[build]]
name = "pong"
out = "build/pong"
commands = [["cp", "build/ship/work/guest/mipsel-sony-psx/release/game-magikaaaaaarp-pong.map", "{out}/game-magikaaaaaarp-pong.map"]]
map = "game-magikaaaaaarp-pong.map"

# Size bars: text may not grow and free RAM may not fall (tolerance 0), against the baseline blessed on
# the repinned build. Reason: every program is smaller than in the build installed in the library
# (launcher text -10.7 KB, each game about -12 KB, the previous lane's measurement of both builds), so a
# bar at the new figures is tighter than the installed one and leaves no room to give the saving back.
[[size]]
build = "ship"

[[size]]
build = "breakout"

[[size]]
build = "invaders"

[[size]]
build = "pong"

[journeys]
files = "tests/*.toml"
precheck = ["launch-breakout", "pad-refusal"]

[cross]
smoke = ["tests/launch-breakout.toml", "tests/launch-invaders.toml", "tests/launch-pong.toml"]
# The launcher refuses anything but a DualShock in analog mode.
pads = ["dualshock"]

[[host]]
name = "disc-toc-tests"
command = ["cargo", "test", "-q", "--manifest-path", ".psoxide/engine/Cargo.toml", "-p", "psx-disc-toc"]

[[host]]
name = "carousel-tests"
command = ["cargo", "test", "-q", "--manifest-path", ".psoxide/engine/Cargo.toml", "-p", "psx-carousel"]

[[host]]
name = "mkdisc-tests"
command = ["cargo", "test", "-q"]
dir = "tools/mkdisc"

# Load-delay hazards in guest asm (fleet rule since SDK 580daa02), with the pin's own scanner.
[[host]]
name = "check-mfc0"
command = ["cargo", "run", "-q", "--release", "--locked", "--manifest-path", ".psoxide/tools/psoxide-hazard/Cargo.toml", "--bin", "check-mfc0", "--", "launcher", "games"]

[[clean]]
build = "ship"
seed = [".psoxide"]
compare = ["psoxide-arcade.bin", "psoxide-arcade.cue", "launcher.exe", "game-breakout.exe", "game-invaders.exe", "game-magikaaaaaarp-pong.exe"]

[[install]]
build = "ship"
name = "PSoXide Arcade (psoxide-arcade)"

# Speed windows: one poll-bound tape per game (`psoxide-test tape --pad dualshock`, the schedules in
# pgo/README.txt). Each opens the game from the launcher (the launcher needs the DualShock), starts a
# round and plays; the window is a stretch of live play after the load. The bar is the blessed spread
# of the harness's measures (frames presented, work per frame, p99 frame, frames by vblank count).
# Reason for the bar: it is the blessed spread of the repinned build, and it is looser than the build
# installed in the library (bff0839, SDK 0187c5f4fab8), which was measured on the same three tapes and
# windows on 2026-11-21 (psoxide-pgo measure, work cycles per frame, p99 frame; every frame presents in
# one vblank in both): invaders 17,512 -> 18,766 (+7.2%), p99 20,692 -> 22,009 (+6.4%); pong 25,422 ->
# 27,554 (+8.4%), p99 47,962 -> 50,769 (+5.8%). The repin allows a measured, logged slowdown; this is
# that log. The bar does not hide a further one: the spread is a few hundred cycles. Limit: breakout's
# frame loop ends in psx-engine's inlined vblank spin, which psoxide-pgo's wait classifier recognises
# in the installed build (work 14,325 per frame) and does not at this pin, so its work figure reads as
# the whole frame (452,983) and only a frame that misses its vblank would move it; the same happens in
# PSXcel (see its psoxide-test.toml). [[speed]] has no key that passes `--wait-range` to name the loop.
#
# Anchored on the launcher's first usable screen (ARCADE_MENU_READY, 11-24), so the boot splash in front
# moves neither the tape nor the window: pgo/NAME.anchored.pxtape is pgo/NAME.pxtape re-anchored with
# `psoxide-test tape-anchor --at-poll 3` (the menu's first frame comes with port 1's third poll on the
# installed build fce1f6855bc1, tick 17, and ARCADE_MENU_READY turns 1 at the third poll on a build
# without the splash, tick 14), and each window is its old polls counted from that anchor.

[[speed]]
name = "breakout"
build = "ship"
anchor = { kind = "ram", sym = "ARCADE_MENU_READY", size = 4, op = "nonzero" }
anchor_max_polls = 600
tape = "pgo/breakout.anchored.pxtape"
polls = [757, 997]
offsets = [-48, -36, -24, -12, 0, 12, 24, 36]

[[speed]]
name = "invaders"
build = "ship"
anchor = { kind = "ram", sym = "ARCADE_MENU_READY", size = 4, op = "nonzero" }
anchor_max_polls = 600
tape = "pgo/invaders.anchored.pxtape"
polls = [757, 997]
offsets = [-48, -36, -24, -12, 0, 12, 24, 36]

[[speed]]
name = "pong"
build = "ship"
anchor = { kind = "ram", sym = "ARCADE_MENU_READY", size = 4, op = "nonzero" }
anchor_max_polls = 600
tape = "pgo/pong.anchored.pxtape"
polls = [847, 1347]
offsets = [-48, -36, -24, -12, 0, 12, 24, 36]
