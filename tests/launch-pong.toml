# Arcade launcher: boot, pick MAGIKAAAAARP PONG (2 to the right), launch it and reach play
# Closed loop only: every press is held until the program's own state says it took, every wait ends
# on state, every checkpoint reads RAM. ARCADE_LAUNCHER_JOURNEY words (launcher/src/main.rs): +0
# magic ARCL, +8 published, +12 tick, +16 selected card, +20 cards shown (three games and the
# credits), +24 analog pad accepted, +28 launch warp frames (-1 for none), +32 card being launched.
# PONG_JOURNEY words (games/journey_state.rs): +0 magic, +8 published, +12 frame, +16 shell screen
# (0 title, 1 playing, 2 paused, 3 results), then the program's own (see its main.rs).
name = "arcade-launch-pong"
title = "Arcade launcher: boot, pick MAGIKAAAAARP PONG (2 to the right), launch it and reach play"
disc = "build/journey/psoxide-arcade.cue"
symbols = ["build/journey/work/guest/mipsel-sony-psx/release/launcher.map", "build/journey/work/guest/mipsel-sony-psx/release/game-magikaaaaaarp-pong.map"]
pad = "dualshock"

[[step]]
label = "the launcher is up"
wait_until = { kind = "ram", sym = "ARCADE_LAUNCHER_JOURNEY", offset = 0, op = "eq", value = 1279480385 }
timeout = 1200

[[step]]
wait_until = { kind = "ram", sym = "ARCADE_LAUNCHER_JOURNEY", offset = 8, op = "eq", value = 1 }
timeout = 60

[[step]]
label = "the DualShock was accepted (the analog handshake takes a few frames)"
wait_until = { kind = "ram", sym = "ARCADE_LAUNCHER_JOURNEY", offset = 24, op = "eq", value = 1 }
timeout = 600

[[step]]
checkpoint = "launcher"
golden = false
[[step.assert]]
kind = "ram"
sym = "ARCADE_LAUNCHER_JOURNEY"
offset = 16
op = "eq"
value = 0
[[step.assert]]
kind = "ram"
sym = "ARCADE_LAUNCHER_JOURNEY"
offset = 20
op = "eq"
value = 4
note = "three games and the credits card"
[[step.assert]]
kind = "ram"
sym = "ARCADE_LAUNCHER_JOURNEY"
offset = 24
op = "eq"
value = 1
note = "the DualShock was accepted"
[[step.assert]]
kind = "ram"
sym = "ARCADE_LAUNCHER_JOURNEY"
offset = 28
signed = true
op = "eq"
value = -1
note = "no launch under way"

[[step]]
label = "browse to card 1"
press = ["right"]
hold_until = { kind = "ram", sym = "ARCADE_LAUNCHER_JOURNEY", offset = 16, op = "eq", value = 1 }
timeout = 300

[[step]]
label = "release"
wait_until = { kind = "ram", sym = "ARCADE_LAUNCHER_JOURNEY", offset = 44, op = "eq", value = 0 }
timeout = 60

[[step]]
label = "browse to card 2"
press = ["right"]
hold_until = { kind = "ram", sym = "ARCADE_LAUNCHER_JOURNEY", offset = 16, op = "eq", value = 2 }
timeout = 300

[[step]]
label = "release"
wait_until = { kind = "ram", sym = "ARCADE_LAUNCHER_JOURNEY", offset = 44, op = "eq", value = 0 }
timeout = 60

[[step]]
label = "launch MAGIKAAAAARP PONG"
press = ["cross"]
hold_until = { kind = "ram", sym = "ARCADE_LAUNCHER_JOURNEY", offset = 28, op = "ge", value = 1, signed = true }
timeout = 300

[[step]]
checkpoint = "launching"
golden = false
[[step.assert]]
kind = "ram"
sym = "ARCADE_LAUNCHER_JOURNEY"
offset = 32
op = "eq"
value = 2
note = "MAGIKAAAAARP PONG is the card launched"

[[step]]
label = "MAGIKAAAAARP PONG loaded from the disc and running"
wait_until = { kind = "ram", sym = "PONG_JOURNEY", offset = 0, op = "eq", value = 1196314448 }
timeout = 1500

[[step]]
wait_until = { kind = "ram", sym = "PONG_JOURNEY", offset = 8, op = "eq", value = 1 }
timeout = 120

[[step]]
checkpoint = "title"
golden = false
[[step.assert]]
kind = "ram"
sym = "PONG_JOURNEY"
offset = 16
op = "eq"
value = 0
note = "its title screen"

[[step]]
label = "Start on the title"
press = ["start"]
hold_until = { kind = "ram", sym = "PONG_JOURNEY", offset = 16, op = "eq", value = 1 }
timeout = 300

[[step]]
checkpoint = "playing"
golden = false
[[step.assert]]
kind = "ram"
sym = "PONG_JOURNEY"
offset = 16
op = "eq"
value = 1
note = "playing"
[[step.assert]]
kind = "ram"
sym = "PONG_JOURNEY"
offset = 20
op = "eq"
value = 0
note = "no winner yet"
[[step.assert]]
kind = "ram"
sym = "PONG_JOURNEY"
offset = 24
op = "eq"
value = 0
[[step.assert]]
kind = "ram"
sym = "PONG_JOURNEY"
offset = 28
op = "eq"
value = 0
